<ion-app>
  <ion-split-pane contentId="main-content">
    <ion-menu contentId="main-content" type="overlay">
      <ion-content>
        <div class="menu-header-box">
          <img src="assets/logo.jpg" alt="Logo IERA" class="menu-logo" />
          <div class="menu-title-wrap">
            <h2 class="menu-app-title">IERA App</h2>
            <p class="menu-app-sub">Louvai ao Senhor</p>
          </div>
        </div>

        <ion-list id="inbox-list">
          <ion-list-header>Navegação</ion-list-header>

          <ion-menu-toggle auto-hide="true">
            <ion-item
              lines="full"
              [routerLink]="['/tabs/hinos']"
              [routerLinkActive]="['router-link-active']"
            >
              <i aria-hidden="true" class="fa fa-book menu-icon"></i>
              <ion-label>Hinos</ion-label>
            </ion-item>

            <ion-item
              lines="full"
              [routerLink]="['/tabs/pesquisa']"
              [routerLinkActive]="['router-link-active']"
            >
              <i aria-hidden="true" class="fa fa-search menu-icon"></i>
              <ion-label>Pesquisa</ion-label>
            </ion-item>

            <ion-item
              lines="full"
              [routerLink]="['/tabs/favoritos']"
              [routerLinkActive]="['router-link-active']"
            >
              <i aria-hidden="true" class="fa fa-star menu-icon text-warning"></i>
              <ion-label>Favoritos</ion-label>
            </ion-item>

            <ion-item
              lines="full"
              [routerLink]="['/tabs/constituicao']"
              [routerLinkActive]="['router-link-active']"
            >
              <i aria-hidden="true" class="fa fa-scroll menu-icon"></i>
              <ion-label>Constituição</ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>

        <ion-list id="textos-liturgicos-list">
          <ion-list-header>Textos Litúrgicos</ion-list-header>

          <ion-menu-toggle auto-hide="true">
            <ion-item
              lines="full"
              [routerLink]="['/dez-mandamentos']"
              [routerLinkActive]="['router-link-active']"
            >
              <i aria-hidden="true" class="fa fa-handshake-alt menu-icon"></i>
              <ion-label>10 Mandamentos</ion-label>
            </ion-item>

            <ion-item
              lines="full"
              [routerLink]="['/credo-apostolico']"
              [routerLinkActive]="['router-link-active']"
            >
              <i aria-hidden="true" class="fa fa-hand-holding-heart menu-icon"></i>
              <ion-label>Credo Apostólico</ion-label>
            </ion-item>

            <ion-item
              lines="full"
              [routerLink]="['/oracao-dominical']"
              [routerLinkActive]="['router-link-active']"
            >
              <i aria-hidden="true" class="fa fa-praying-hands menu-icon"></i>
              <ion-label>Oração Dominical</ion-label>
            </ion-item>

            <ion-item
              lines="full"
              [routerLink]="['/salmos23']"
              [routerLinkActive]="['router-link-active']"
            >
              <i aria-hidden="true" class="fa fa-mountain menu-icon"></i>
              <ion-label>Salmos 23</ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>
      </ion-content>

      <ion-footer class="footer">
        <ion-label class="texto">
          <small>
            IERA App — Edição Digital<br />
            Igreja Evangélica Reformada de Angola
          </small>
        </ion-label>
      </ion-footer>
    </ion-menu>

    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
