spring.application.name=hinario

# --- Pasta de dados local (PRD secção 2/3.1) ---------------------------------
# Vazio = pasta data/ do back-end (seed copiada de mobile/src/assets/data).
# Exemplo do PRD: hinario.dados.dir=${user.home}/iera-dados
hinario.dados.dir=${HINARIO_DADOS_DIR:}

# --- Migração (Fase 1) -------------------------------------------------------
# true = corre a migração no arranque (também disponível em POST /migracao)
hinario.migracao.auto=false

# --- Importação de páginas (Fase 2) ------------------------------------------
# Fotos de telemóvel: limites do multipart acima do omissão de 1 MB do Spring
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=250MB

# --- Leitura com Gemini (Fase 3) ---------------------------------------------
# Interruptor geral (PRD 5.9): false = modo só-Tesseract (a partir da Fase 4)
gemini.enabled=true
# Chave NUNCA no código: só da variável de ambiente (PRD 5.9)
gemini.api-key=${GEMINI_API_KEY:}
# Cadeia de modelos por ordem de preferência — confirmar limites no AI Studio (5.8)
gemini.modelos=gemini-3.8-flash,gemini-3.6-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite
gemini.tentativas-por-modelo=2
gemini.espera-429-minuto-segundos=65
# Temperatura por omissão; por modelo: gemini.temperaturas=gemini-3.8-flash:0,...
gemini.temperatura-padrao=0
gemini.thinking-level=minimal
# Reinício diário da quota (confirmar na documentação da API)
gemini.fuso-quota=America/Los_Angeles
# Sobe esta versão ao mudar a instrução do sistema (chave do cache, PRD 5.8)
gemini.versao-prompt=1
# Espera entre verificações quando todos os modelos estão pausados (retoma sozinha)
hinario.fila.retoma-ms=15000

